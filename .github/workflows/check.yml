name: Auralis checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # GitHub's Ubuntu image already includes Chrome and its runtime libraries.
      # Avoid apt/browser downloads: mirror DNS failures must not block browser QA.
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Browser smoke tests
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: work/browser/
          if-no-files-found: ignore
