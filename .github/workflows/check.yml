name: Auralis checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # GitHub's Ubuntu image already includes Chrome and its runtime libraries.
      # Avoid apt/browser downloads: mirror DNS failures must not block browser QA.
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Core browser integration suite
        run: npm run test:browser:core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: work/browser/
          if-no-files-found: ignore

  first_dungeon:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Earn progression and clear first dungeon without fixtures
        run: npm run test:browser:first-dungeon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-first-dungeon
          path: work/browser/
          if-no-files-found: ignore

  android_ui_and_art:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Phone panels, combat indicators, bestiary and streamed painted actors
        run: npm run test:browser:android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-android
          path: work/browser/
          if-no-files-found: ignore
