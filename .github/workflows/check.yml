name: Auralis checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  core_browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [world, quests, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Use runner Chrome; no apt or browser download is needed.
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Existing browser checks
        run: npm run test:browser:core:${{ matrix.group }}
      - name: Full-width home background, six viewports and three languages
        if: matrix.group == 'ui'
        run: npm run test:browser:task7
      - name: Task8 home scale and streamed NPC quest indicators
        if: matrix.group == 'ui'
        run: npm run test:browser:task8
      - name: Quest journal claim and reload in three languages
        if: matrix.group == 'quests'
        run: npm run test:browser:task5-journal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.group }}
          path: work/browser/
          if-no-files-found: ignore

  first_dungeon:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Earn progression and clear first dungeon without fixtures
        run: npm run test:browser:first-dungeon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-first-dungeon
          path: work/browser/
          if-no-files-found: ignore

  android_ui_and_art:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Phone panels, combat indicators, bestiary and streamed painted actors
        run: npm run test:browser:android && npm run test:browser:menu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-android
          path: work/browser/
          if-no-files-found: ignore

  task1_combat_loot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Dungeon visits, ground loot, combat AI, viewport streaming and multiple touch pointers
        run: npm run test:browser:task1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-task1
          path: |
            work/browser/
            work/stream-benchmark/
          if-no-files-found: ignore

  task2_interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [ru, en, es]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Six classes and three languages, compact HUD, timed effects and paused panels
        run: npm run test:browser:task2
        env:
          AURALIS_TASK2_LANGS: ${{ matrix.language }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-task2-${{ matrix.language }}
          path: work/browser/
          if-no-files-found: ignore

  task4_loot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Grouped loot window, durable single and bulk pickup, world radius and touch controls
        run: npm run test:browser:task4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-task4
          path: work/browser/
          if-no-files-found: ignore

  task5_compact_ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [ru, en, es]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Compact windows, five viewports, scrolling and unchanged combat controls
        run: npm run test:browser:task5-ui
        env:
          AURALIS_TASK5_LANGS: ${{ matrix.language }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-task5-${{ matrix.language }}
          path: work/task5-after/
          if-no-files-found: ignore

  task6_warrior_equipment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Warrior PNG set, real inventory, body sockets, save isolation and texture residency
        run: npm run test:browser:task6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-task6-warrior
          path: work/task6/
          if-no-files-found: ignore
