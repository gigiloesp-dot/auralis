name: Auralis checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The lossless delivery test compares PNGs with their pinned ancestor.
          # A shallow PR merge checkout omits that provenance commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  core_browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [world, quests, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Use runner Chrome; no apt or browser download is needed.
      - name: Verify runner Chrome
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          "$chrome_path" --version
          echo "CHROMIUM_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Existing browser checks
        run: npm run test:browser:core:${{ matrix.group }}
      - name: Full-width home background, six viewports and three languages
        if: matrix.group == 'ui'
        run: npm run test:browser:task7
      - name: Task8 home scale and streamed NPC quest indicators
        if: matrix.group == 'ui'
        run: npm run test:browser:task8
      - name: Quest journal claim and reload in three languages
        if: matrix.group == 'quests'
        run: npm run test:browser:task5-journal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.group }}
          path: work/browser/
          if-no-files-found: ignore

  first_dungeon:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
