function draw(){g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);g.fillStyle='#172b36';g.fillRect(0,0,W,H);let cx=W/2,cy=H*.56,tilt=.58;function pt(x,y){return[cx+x-p.x,cy+(y-p.y)*tilt]}let ground=g.createLinearGradient(0,0,0,H);ground.addColorStop(0,'#233b3a');ground.addColorStop(.52,'#2c4841');ground.addColorStop(1,'#203735');g.fillStyle=ground;g.fillRect(0,0,W,H);

let all=[...enemies.map(e=>({...e,kind:'enemy'})),...gems.map(e=>({...e,kind:'gem'})),{...p,kind:'player'}];all.sort((a,b)=>a.y-b.y);for(let s of all){let [x,y]=pt(s.x,s.y);if(x< -40||x>W+40||y< -80||y>H+60)continue;if(s.kind==='gem'){g.fillStyle='#57efff';g.beginPath();g.arc(x,y-8,5,0,7);g.fill();continue}let r=s.kind==='player'?15:s.r,hero=s.kind==='player',moving=hero?Math.hypot(stick.x,stick.y)>.08:true,bob=moving?Math.sin(time*11+(hero?0:s.x*.1))*2:0,shade=hero?'#245b9d':s.type==='tank'?'#693540':s.type==='fast'?'#92651e':'#397249',coat=hero?'#4d9af0':s.type==='tank'?'#c56c79':s.type==='fast'?'#e5b35b':'#6acb8b';
let dir=hero?p.dir:(Math.round(Math.atan2(p.y-s.y,p.x-s.x)/(Math.PI/4))+8)%8,ang=dir*Math.PI/4,front=Math.sin(ang),side=Math.cos(ang),back=front<-.38,profile=Math.abs(side)>.85,turnWidth=profile?.57:Math.abs(side)>.35?.82:1;
g.fillStyle='#0007';g.beginPath();g.ellipse(x,y+3,r+4,7,0,0,7);g.fill();

let step=moving?Math.sin(time*11+(hero?0:s.y*.07))*5:0,footWidth=7*turnWidth;
limb(x-footWidth,y-14+bob,x-footWidth-step*turnWidth,y-1,7,'#273d54');limb(x+footWidth,y-14+bob,x+footWidth+step*turnWidth,y-1,7,'#23364b');

if(hero){let swordSide=side>=0?1:-1,sx=x+swordSide*(12*turnWidth+2),sy=y-18+bob;g.strokeStyle='#8d6a37';g.lineWidth=4;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+swordSide*3,sy-5);g.stroke();g.strokeStyle='#e4f1ff';g.lineWidth=3;g.beginPath();g.moveTo(sx+swordSide*3,sy-5);g.lineTo(sx+swordSide*15,sy-20);g.stroke()}else{if(s.hit>.5){g.fillStyle='#ffffff70';g.fillRect(x-12*turnWidth,y-36+bob,24*turnWidth,20)}g.fillStyle='#0009';g.fillRect(x-r,y-57,r*2,4);g.fillStyle='#ed6971';g.fillRect(x-r,y-57,r*2*Math.max(0,s.hp/s.max),4)}
}for(let b of shots){for(let i=0;i<b.trail.length;i++){let [tx,ty]=pt(b.trail[i].x,b.trail[i].y);g.fillStyle='rgba(255,205,90,'+((i+1)/b.trail.length*.42)+')';g.beginPath();g.arc(tx,ty-23,2+i*.4,0,7);g.fill()}let [x,y]=pt(b.x,b.y);g.fillStyle='#ffe58a';g.shadowColor='#ffae3e';g.shadowBlur=4;g.beginPath();g.arc(x,y-23,4,0,7);g.fill();g.shadowBlur=0}for(let q of fx){let [x,y]=pt(q.x,q.y);g.globalAlpha=Math.min(1,q.life/.25);g.fillStyle=q.color;g.beginPath();g.arc(x,y-22,2.5,0,7);g.fill()}g.globalAlpha=1;g.font='bold 15px system-ui';g.textAlign='center';for(let q of texts){let [x,y]=pt(q.x,q.y);g.globalAlpha=Math.min(1,q.life/.2);g.fillStyle=q.color;g.strokeStyle='#14212c';g.lineWidth=3;g.strokeText(q.label,x,y-35);g.fillText(q.label,x,y-35)}g.globalAlpha=1;g.textAlign='start';g.restore();g.fillStyle='#0009';g.fillRect(12,37,180,12);g.fillStyle='#ec566a';g.fillRect(12,37,180*Math.max(0,p.hp)/100,12);g.fillStyle='#0009';g.fillRect(12,55,180,6);g.fillStyle='#5dd9fc';g.fillRect(12,55,180*xp/need,6);document.getElementById('stat').textContent='❤ '+Math.max(0,Math.ceil(p.hp))+' · Ур. '+level+' · ☠ '+kills;document.getElementById('clock').textContent=Math.max(0,Math.ceil(60-time))+' сек'}
