<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LAST 60</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111c29;color:white;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 3px #000;pointer-events:none}#joy{position:absolute;left:22px;top:68%;transform:translateY(-50%);width:126px;height:126px;border:2px solid #ffffff60;border-radius:50%;background:#ffffff18;touch-action:none}#nub{position:absolute;left:35px;top:35px;width:52px;height:52px;background:#c4d8ffad;border-radius:50%}#modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center}#panel{background:#202d43;border:1px solid #789;border-radius:16px;padding:20px;text-align:center;max-width:92vw}button{background:#3c67a3;color:#fff;border:0;border-radius:12px;padding:12px;margin:5px;font-weight:bold}#tip{position:absolute;right:10px;bottom:8px;opacity:.6;font-size:11px}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="stat"></span><span id="clock"></span></div><div id="joy"><div id="nub"></div></div><div id="tip">Джойстик слева · стрельба автоматическая</div><div id="modal"><div id="panel"></div></div><script>
const c=document.getElementById('game'),g=c.getContext('2d'),joy=document.getElementById('joy'),nub=document.getElementById('nub'),modal=document.getElementById('modal'),panel=document.getElementById('panel');let W,H,scale;function size(){W=innerWidth;H=innerHeight;scale=Math.min(devicePixelRatio||1,2);c.width=W*scale;c.height=H*scale;g.setTransform(scale,0,0,scale,0,0)}addEventListener('resize',size);size();let stick={x:0,y:0},p,enemies,shots,gems,level,xp,need,kills,time,spawn,fire,paused,damage,cooldown,last;function reset(){p={x:0,y:0,hp:100};enemies=[];shots=[];gems=[];level=1;xp=0;need=5;kills=0;time=0;spawn=0;fire=0;paused=false;damage=26;cooldown=.38;modal.style.display='none';last=performance.now()}reset();
function setStick(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-63,y=e.clientY-r.top-63,d=Math.hypot(x,y);if(d>43){x=x/d*43;y=y/d*43}stick.x=x/43;stick.y=y/43;nub.style.transform='translate('+x+'px,'+y+'px)'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);setStick(e)});joy.addEventListener('pointermove',e=>{if(e.buttons||e.pressure)setStick(e)});function stop(){stick.x=stick.y=0;nub.style.transform=''}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
function enemy(){let a=Math.random()*Math.PI*2,d=550+Math.random()*150,type=Math.random()<.16?'tank':Math.random()<.25?'fast':'normal';enemies.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,type,hp:type==='tank'?115:type==='fast'?28:52,max:type==='tank'?115:type==='fast'?28:52,speed:type==='tank'?48:type==='fast'?115:73,r:type==='tank'?20:type==='fast'?10:14,hit:0})}
function popup(title,opts){paused=true;modal.style.display='flex';panel.innerHTML='<h2>'+title+'</h2>';opts.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;panel.appendChild(b)})}function resume(){paused=false;modal.style.display='none';last=performance.now()}function end(win){popup(win?'ПОБЕДА!':'ИГРА ОКОНЧЕНА',[['Убийств: '+kills+' · Уровень: '+level+' · Заново',reset]])}
function upgrade(){popup('Уровень '+level,[['⚔ Урон +30%',()=>{damage*=1.3;resume()}],['⚡ Скорострельность +25%',()=>{cooldown*=.8;resume()}],['❤ Восстановить 35 HP',()=>{p.hp=Math.min(100,p.hp+35);resume()}]])}
function update(dt){time+=dt;if(time>=60){end(true);return}p.x+=stick.x*180*dt;p.y+=stick.y*180*dt;spawn-=dt;if(spawn<=0){for(let i=0;i<Math.min(5,1+Math.floor(time/13));i++)enemy();spawn=Math.max(.28,.9-time*.009)}fire-=dt;if(fire<=0){let t=null,best=440;for(let e of enemies){let d=Math.hypot(e.x-p.x,e.y-p.y);if(d<best){best=d;t=e}}if(t){let a=Math.atan2(t.y-p.y,t.x-p.x);shots.push({x:p.x,y:p.y,vx:Math.cos(a)*470,vy:Math.sin(a)*470,life:1.3});fire=cooldown}}for(let e of enemies){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.hit-=dt;if(d<e.r+12&&e.hit<=0){p.hp-=e.type==='tank'?16:9;e.hit=.7;if(p.hp<=0){end(false);return}}}for(let b of shots){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of enemies){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp-=damage;b.life=0;break}}}shots=shots.filter(b=>b.life>0);for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];if(e.hp<=0){gems.push({x:e.x,y:e.y});enemies.splice(i,1);kills++}}for(let i=gems.length-1;i>=0;i--){let q=gems[i],d=Math.hypot(q.x-p.x,q.y-p.y);if(d<130){q.x+=(p.x-q.x)*Math.min(1,dt*6);q.y+=(p.y-q.y)*Math.min(1,dt*6)}if(d<22){gems.splice(i,1);xp++;if(xp>=need){xp-=need;need=Math.ceil(need*1.4);level++;upgrade();break}}}}
function draw(){g.fillStyle='#172b36';g.fillRect(0,0,W,H);let cx=W/2,cy=H*.56,tilt=.58;function pt(x,y){return[cx+x-p.x,cy+(y-p.y)*tilt]}g.strokeStyle='#28434a';g.lineWidth=1;for(let x=Math.floor((p.x-W)/80)*80;x<p.x+W;x+=80){let a=pt(x,p.y-H*2),b=pt(x,p.y+H*2);g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}for(let y=Math.floor((p.y-H*2)/80)*80;y<p.y+H*2;y+=80){let a=pt(p.x-W,y),b=pt(p.x+W,y);g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}let all=[...enemies.map(e=>({...e,kind:'enemy'})),...gems.map(e=>({...e,kind:'gem'})),{...p,kind:'player'}];all.sort((a,b)=>a.y-b.y);for(let s of all){let [x,y]=pt(s.x,s.y);if(x< -40||x>W+40||y< -80||y>H+60)continue;if(s.kind==='gem'){g.fillStyle='#57efff';g.beginPath();g.arc(x,y-8,5,0,7);g.fill();continue}let r=s.kind==='player'?15:s.r;g.fillStyle='#0008';g.beginPath();g.ellipse(x,y+3,r,6,0,0,7);g.fill();g.strokeStyle='#24303b';g.lineWidth=5;g.beginPath();g.moveTo(x-5,y-10);g.lineTo(x-6,y+3);g.moveTo(x+5,y-10);g.lineTo(x+6,y+3);g.stroke();g.fillStyle=s.kind==='player'?'#4c98e9':s.type==='tank'?'#ad5962':s.type==='fast'?'#dba54a':'#66b778';g.fillRect(x-r*.65,y-34,r*1.3,25);g.strokeStyle='#cba88e';g.lineWidth=4;g.beginPath();g.moveTo(x-r*.65,y-28);g.lineTo(x-r,y-12);g.moveTo(x+r*.65,y-28);g.lineTo(x+r,y-12);g.stroke();g.fillStyle='#e6bc9a';g.beginPath();g.arc(x,y-42,r*.62,0,7);g.fill();if(s.kind==='player'){g.strokeStyle='#dcecff';g.lineWidth=3;g.beginPath();g.moveTo(x+13,y-14);g.lineTo(x+28,y-29);g.stroke()}else{g.fillStyle='#0009';g.fillRect(x-r,y-57,r*2,4);g.fillStyle='#ed6971';g.fillRect(x-r,y-57,r*2*Math.max(0,s.hp/s.max),4)}}for(let b of shots){let [x,y]=pt(b.x,b.y);g.fillStyle='#ffe58a';g.beginPath();g.arc(x,y-23,5,0,7);g.fill()}g.fillStyle='#0009';g.fillRect(12,37,180,12);g.fillStyle='#ec566a';g.fillRect(12,37,180*Math.max(0,p.hp)/100,12);g.fillStyle='#0009';g.fillRect(12,55,180,6);g.fillStyle='#5dd9fc';g.fillRect(12,55,180*xp/need,6);document.getElementById('stat').textContent='❤ '+Math.max(0,Math.ceil(p.hp))+' · Ур. '+level+' · ☠ '+kills;document.getElementById('clock').textContent=Math.max(0,Math.ceil(60-time))+' сек'}
function loop(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(!paused)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
